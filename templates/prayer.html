{% extends 'base.html' %}

{% block content %}
<section class="container inner-page">
  <div class="page-header">
    <h1>Prayer wall</h1>
    <p>Bring your needs, praises, and requests before God with the community.</p>
  </div>

  <div class="form-card">
    <form method="post">
      <label>
        Name
        <input type="text" name="name" placeholder="Your name or initials">
      </label>
      <label>
        Prayer request
        <textarea name="request" rows="6" placeholder="Share what you’re praying for..."></textarea>
      </label>
      <button type="submit">Submit prayer</button>
    </form>
  </div>

  <div class="card card-list">
    <h2>Community prayers</h2>
    {% for prayer in prayers %}
      <article class="list-item">
        <strong>{{ prayer.name }}</strong>
        <p>{{ prayer.request }}</p>
      </article>
    {% else %}
      <p>No prayers have been shared yet.</p>
    {% endfor %}
  </div>
</section>
{% endblock %}
